# Included in the HTTP context, not a server block.
server {
    listen 127.0.0.1:8080;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    server_name 5.249.252.78;
    root /srv/radiorubben-test/studio/public;
    index index.php;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-RR-Environment "test" always;
    sub_filter '<title>Radio Rubben Studio</title>' '<title>TEST — Radio Rubben Studio</title>';
    sub_filter '<body>' '<body><div class="notice" role="status">TESTMILJØ · Egne testdata · Eksterne tjenester er frakoblet.</div>';
    sub_filter_once on;
    location = /login.php { return 302 /local/login.php; }
    location ^~ /auth/ { return 403; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass unix:/run/php/rr-studio.sock;
    }
}
server {
    listen 127.0.0.1:8081;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    server_name 5.249.252.78;
    root /srv/radiorubben-test/wordpress;
    index index.php;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-RR-Environment "test" always;
    location ~ /\. { deny all; }
    location ~* ^/(wp-config|wp-salts|xmlrpc|wp-cron)\.php$ { deny all; }
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 8443;
        fastcgi_pass unix:/run/php/rr-wordpress.sock;
    }
}
