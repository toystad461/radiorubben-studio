[rr-studio]
user = rr-studio
group = rr-studio
listen = /run/php/rr-studio.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
php_admin_value[session.save_path] = /srv/radiorubben-test/studio-sessions
php_admin_value[date.timezone] = Europe/Oslo
php_admin_value[memory_limit] = 256M
php_admin_value[sendmail_path] = /bin/false
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[allow_url_fopen] = off
php_admin_value[open_basedir] = /srv/radiorubben-test/studio:/srv/radiorubben-test/releases:/srv/radiorubben-test/studio-data:/srv/radiorubben-test/studio-sessions:/tmp:/usr/share/php:/etc/ssl/certs

