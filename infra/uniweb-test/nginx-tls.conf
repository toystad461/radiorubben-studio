server {
    listen 443 ssl;
    server_name 5.249.252.78;
    ssl_certificate /etc/letsencrypt/live/5.249.252.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.249.252.78/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 5.249.252.78;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 8443 ssl;
    server_name 5.249.252.78;
    ssl_certificate /etc/letsencrypt/live/5.249.252.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.249.252.78/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host 5.249.252.78:8443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
