name: Studio release and guarded Uniweb deployment
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check only or publish changed code with backup and drift protection'
        type: choice
        options: [dry-run, publish]
        default: dry-run
permissions:
  contents: read
concurrency:
  group: studio-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, zip
          tools: composer:v2
          coverage: none
      - name: Validate and test the existing PHP Studio
        run: |
          composer install --no-dev --prefer-dist --no-interaction
          composer validate --strict
          composer audit
          composer test
          bash -n scripts/deploy-studio.sh
          bash -n scripts/deploy-studio-remote.sh
          bash tests/test-deploy-block.sh
          php tests/test-studio-selective.php
          bash -n scripts/studio-auto-publish.sh
      - name: Check Studio JavaScript and automatic case preparation
        run: |
          find public \( -name '*.mjs' -o -name '*.js' \) -exec node --check {} \;
          node tests/recovered/test-case-flow.mjs
      - name: Build versioned release using the existing packager
        run: |
          php scripts/build-release.php "$GITHUB_SHA"
          cd dist
          sha256sum -c radiorubben-studio-*.zip.sha256
          unzip -t "radiorubben-studio-$(cat ../VERSION)-uniweb.zip"
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: studio-release
          if-no-files-found: error
          path: |
            dist/radiorubben-studio-*-uniweb.zip
            dist/*.sha256
            dist/release.json
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/recovered/test-newsroom-mobile.cjs
  deploy:
    needs: [verify, mobile]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    environment: studio-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: studio-release
          path: dist
      - name: Check Studio-specific deployment settings without exposing secrets
        id: settings
        env:
          DEPLOY_KEY: ${{ secrets.STUDIO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STUDIO_DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.STUDIO_SSH_HOST }}
          SSH_USER: ${{ vars.STUDIO_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ready=true
          for pair in 'DEPLOY_KEY:STUDIO_DEPLOY_SSH_KEY' 'KNOWN_HOSTS:STUDIO_DEPLOY_KNOWN_HOSTS' 'SSH_HOST:STUDIO_SSH_HOST' 'SSH_USER:STUDIO_SSH_USER'; do
            key=${pair%%:*}; name=${pair#*:}
            if [[ -z "${!key}" ]]; then
              echo "::warning::Missing Studio setting: $name"
              echo "- Missing: $name" >> "$GITHUB_STEP_SUMMARY"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == false ]]; then
            echo '::error::Missing SSH settings; preflight cannot run.'
            exit 1
          fi
      - name: Configure verified SSH connection
        if: steps.settings.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.STUDIO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STUDIO_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish changed Studio code or run preflight
        id: ship
        if: steps.settings.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PUBLISH: ${{ vars.STUDIO_DEPLOY_AUTO_APPLY }}
          EVENT: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          STUDIO_SSH_HOST: ${{ vars.STUDIO_SSH_HOST }}
          STUDIO_SSH_USER: ${{ vars.STUDIO_SSH_USER }}
        run: |
          set -Eeuo pipefail
          mode=dry-run
          if [[ "$EVENT" == push && "$AUTO_PUBLISH" == true ]]; then mode=publish; fi
          if [[ "$EVENT" == workflow_dispatch ]]; then mode="$REQUESTED_MODE"; fi
          if [[ "$mode" == publish ]]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$latest" != "$GITHUB_SHA" ]]; then
              echo 'Superseded by newer main; no files published.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            bash scripts/studio-auto-publish.sh | tee /tmp/studio-publish-result.log
            echo "## Studio publication verified: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            tail -1 /tmp/studio-publish-result.log >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$mode" == dry-run ]] || exit 1
            bash scripts/deploy-studio.sh dry-run
            echo '## Dry-run completed; website files unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
