name: PHP checks and Uniweb package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer audit
      - run: composer test
      - run: |
          for file in overlays/uniweb/studio-public/{index,control,sending,newsdesk,learning}.php overlays/uniweb/studio-private/app/{board,story-script,editorial-memory,programs,views/sidebar,auth/StudioLocalUsers,intro-mail}.php overlays/uniweb/studio-public/local/admin-panel.php; do php -l "$file"; done
          php overlays/uniweb/test-board.php
          php overlays/uniweb/test-newsdesk.php
          php overlays/uniweb/test-intro-mail.php
          php overlays/uniweb/test-story-script.php
          php overlays/uniweb/test-editorial-memory.php
          php overlays/uniweb/test-programs.php
      - if: matrix.php == '8.4'
        run: php scripts/package.php
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: uniweb-package
          path: |
            dist/radiorubben-studio-uniweb.zip
            composer.lock


