name: PHP checks and Uniweb package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer audit
      - name: Check Studio JavaScript and automatic case preparation
        run: |
          find public \( -name '*.mjs' -o -name '*.js' \) -exec node --check {} \;
          node tests/recovered/test-case-flow.mjs
      - name: Check full-package deployment stop before any server access
        run: bash tests/test-deploy-block.sh
      - run: python3 tests/test-audio-key.py
      - run: composer test
      - if: matrix.php == '8.4'
        run: php scripts/package.php
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: uniweb-package
          path: |
            dist/radiorubben-studio-uniweb.zip
            composer.lock

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/recovered/test-newsroom-mobile.cjs
      - run: node tests/recovered/test-newsroom-channel-mobile.cjs
      - run: node tests/recovered/test-learning-mobile.cjs
      - run: node tests/recovered/test-audio-mobile.cjs
      - run: node tests/recovered/test-bulletin-mobile.cjs
