name: PHP checks and Uniweb package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer audit
      - name: Check Studio JavaScript and automatic case preparation
        run: |
          find public -name '*.mjs' -exec node --check {} \;
          node tests/recovered/test-case-flow.mjs
      - run: composer test
      - if: matrix.php == '8.4'
        run: php scripts/package.php
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: uniweb-package
          path: |
            dist/radiorubben-studio-uniweb.zip
            composer.lock
