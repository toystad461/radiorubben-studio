ServerName studio-staging
<VirtualHost *:10000>
    DocumentRoot /opt/studio/public
    <Directory /opt/studio/public>
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.php
        AuthType Basic
        AuthName "Radio Rubben Studio - test"
        AuthUserFile /run/studio.htpasswd
        Require valid-user
        AddType application/javascript .mjs
    </Directory>
    <LocationMatch "^/healthz\\.php$">
        AuthType None
        Require all granted
    </LocationMatch>
    # Only deploy behind Render's TLS-terminating edge; no public direct port.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Robots-Tag "noindex, nofollow"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
